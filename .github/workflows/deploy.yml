name: Deploy PE1 Walkie Talkie Borrow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Deploy static app to GitHub Pages ──────────────────────────────────────
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Deploy Cloud Functions to Firebase ─────────────────────────────────────
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --token "$FIREBASE_TOKEN" --non-interactive --force
        working-directory: functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ── Deploy static app to Cloudflare Pages (alternate URL for distribution) ──
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only the files sw.js actually caches (STATIC_ASSETS) — the "functions/"
      # dir must NOT be included here, or Cloudflare Pages will try to parse
      # its Firebase Cloud Functions source as its own Pages Functions.
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html sw.js manifest.json icon-192.png icon-512.png tailwind.css dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e87e6b4e7ec59834a35db192e7e37eb8
          command: pages deploy dist --project-name=pe1-walkie-talkie-borrow --branch=main
